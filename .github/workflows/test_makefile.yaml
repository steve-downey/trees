# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception

name: Makefile Workflow Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'

jobs:
  test_matrix:
    strategy:
      fail-fast: false
    name:  Test System Compiler with Makefile
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bemanproject/testingcontainers-gcc:14
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'
      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          # Install a specific version of uv.
          version: "0.11.6"
      - name: Install system tools
        shell: bash
        run: |
         sudo apt update
         sudo apt -y install build-essential gcc-14 g++-14 ccache jq
         sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 \
           --slave /usr/bin/g++ g++ /usr/bin/g++-14 \
           --slave /usr/bin/gcov gcov /usr/bin/gcov-14
         sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-14  100
         sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 100
         sudo update-alternatives --set gcc  /usr/bin/gcc-14
         sudo update-alternatives --set cc  /usr/bin/gcc-14
         sudo update-alternatives --set c++  /usr/bin/g++-14

      - name: Configure Environment
        shell: bash
        run: |
          make venv

        env:
          CMAKE_GENERATOR: "Ninja Multi-Config"
      - name: Build
        shell: bash
        run: |
         source .venv/bin/activate
         make compile
      - name: Test
        shell: bash
        run: |
         source .venv/bin/activate
         make test
      - name: Law-Focused Test Gate
        shell: bash
        run: |
         source .venv/bin/activate
         make compile
         BUILD_PATH=$(make -pn | awk -F' := ' '/^_build_path := /{print $2; exit}')
         uv run ctest --test-dir "$BUILD_PATH" --output-on-failure -C Asan \
           -R "ApplicativeBehaviorTest|ZipListApplicativeTest - InterchangeLaw|ZipListApplicativeTest - CompositionLaw|ZipListApplicativeTest - IdentityHomomorphismAndInvokeViaHarness|TraversableTypeclassTest - SequenceMatchesTraverseIdentity|RangeTraversableTest - SequenceConvertsRangeOfZiplistsToZiplistOfRanges"
      - name: Generate Coverage Files
        shell: bash
        run: |
         source .venv/bin/activate
         make coverage
      - name: Coverage Gate
        shell: bash
        run: |
         set -e
         BUILD_PATH=$(make -pn | awk -F' := ' '/^_build_path := /{print $2; exit}')
         COVERAGE_HTML=$(find "$BUILD_PATH" -path "*/coverage/coverage.html" | head -n 1)
         test -n "$COVERAGE_HTML"
         test -f "$COVERAGE_HTML"
      - name: Lint
        shell: bash
        run: |
         set -x
         echo $PATH
         echo $(command -v jq)
         echo $(command -v shellcheck)
         source .venv/bin/activate
         echo $(command -v jq)
         echo $(command -v shellcheck)
         make lint
      - name: Manual Lint
        shell: bash
        run: |
         source .venv/bin/activate
         make lint
      - name: Test Install
        shell: bash
        run: |
         source .venv/bin/activate
         make testinstall
